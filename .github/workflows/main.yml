name: Auto Update Exam Navigator

on:
  push:
    paths: ['**.md', '**.py']
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 1. 直接拉取代码 (这是必修课，速度很快)
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 直接运行系统内置的 python3
      # 彻底删除 setup-python 步骤，避免 Waiting/Download 导致超时
      - name: Run Generator
        run: python3 generate_nav.py

      # 3. 提交代码
      - name: Commit and Push
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md index.md
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "docs: 极速模式更新导航"
            git push
          fi
